<html lang="en" data-theme="dark">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlernsBoard</title>

<style>
:root {
  color-scheme: dark;
  --page: #101114;
  --card: #15161a;
  --card-2: #1c1d22;
  --border: rgba(255,255,255,.08);
  --border-2: rgba(255,255,255,.16);
  --ink: #e7e7e4;
  --ink-2: #a3a49f;
  --ink-3: #6c6d72;
  --grid: #23242a;
  --axis: #34353b;
  --warn: #e0a23a;
  --sel: rgba(231,231,228,.08);
  --sel-2: rgba(231,231,228,.14);
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #f3f3f1;
  --card: #ffffff;
  --card-2: #f4f4f2;
  --border: rgba(0,0,0,.10);
  --border-2: rgba(0,0,0,.20);
  --ink: #17181b;
  --ink-2: #55565b;
  --ink-3: #8a8b90;
  --grid: #ececea;
  --axis: #d6d6d3;
  --warn: #9b5f05;
  --sel: rgba(23,24,27,.06);
  --sel-2: rgba(23,24,27,.11);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  --side: 264px;
  background: var(--page);
  color: var(--ink);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid;
  grid-template-rows: 44px minmax(0, 1fr);
  grid-template-columns: var(--side) minmax(0, 1fr);
  height: 100vh;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 1px solid transparent; border-radius: 3px; padding: 2px 7px; cursor: pointer; }
button:hover { background: var(--sel); }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
input[type=text], select {
  background: var(--card); border: 1px solid var(--border-2); border-radius: 3px; padding: 4px 7px; width: 100%;
}
input[type=text]::placeholder { color: var(--ink-3); }
input[type=text].bad { border-color: var(--warn); }
.num { font-variant-numeric: tabular-nums; }

/* header */
header {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 14px; padding: 0 14px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}
header .brand { font-weight: 600; letter-spacing: .01em; display: inline-flex; align-items: center; gap: 7px; }
header .mark { width: 18px; height: 18px; }
header .root { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
header .fresh { display: flex; align-items: center; gap: 7px; color: var(--ink-2); white-space: nowrap; }
header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); transition: background .2s; }
header .dot.busy { background: var(--ink-3); }
header .dot.bad { background: var(--warn); }
header select { width: auto; padding: 2px 4px; }
header .errs { color: var(--warn); display: none; }
header .errs.on { display: inline; }

/* sidebar */
aside {
  border-right: 1px solid var(--border);
  overflow: hidden;
  padding: 10px 10px 12px;
  background: var(--card);
  display: flex; flex-direction: column; min-height: 0; position: relative;
}
aside .resize { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; z-index: 2; }
aside .resize:hover, aside .resize.on { background: var(--sel-2); }
aside .disp { flex: none; border-top: 1px solid var(--border); padding-top: 4px; margin-top: 8px; }
aside h2 { font-size: 13px; font-weight: 600; margin: 8px 4px 6px; display: flex; justify-content: space-between; color: var(--ink); }
aside h2 .count { color: var(--ink-3); font-weight: 400; }
.runtools { display: flex; align-items: center; gap: 2px; margin: 6px 0 2px; color: var(--ink-2); }
.runtools button { padding: 1px 6px; }
.master { flex: 1; display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 3px; cursor: pointer; user-select: none; color: var(--ink); }
.master:hover { background: var(--sel); }
.master .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 2px solid var(--ink-2); background: var(--ink-2); }
.master[aria-checked="false"] .sw { background: transparent; }
.master[aria-checked="mixed"] .sw { background: linear-gradient(to right, var(--ink-2) 50%, transparent 50%); }
.master[aria-checked="false"] { color: var(--ink-3); }
#runs { list-style: none; margin: 0; padding: 0; flex: 0 1 auto; min-height: 80px; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; }
#runs li {
  display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 3px; cursor: pointer;
  user-select: none; min-height: 24px;
}
#runs li[hidden] { display: none; }
#runs li:hover { background: var(--sel); }
#runs li.hl { background: var(--sel-2); }
#runs li.near { background: var(--sel); }
#runs .sw {
  width: 12px; height: 12px; border-radius: 3px; flex: none;
  background: var(--c); border: 2px solid var(--c);
}
#runs li.off .sw { background: transparent; }
#runs li.off .name { color: var(--ink-3); }
#runs .name { flex: 1; min-width: 0; display: flex; white-space: nowrap; }
#runs .name .a { flex: 0 4 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
#runs .name .b { flex: 0 1 auto; min-width: 45%; overflow: hidden; text-overflow: ellipsis; }
#runs li.off .name .a { color: var(--ink-3); }
#runs .meta { color: var(--ink-3); font-size: 11px; white-space: nowrap; }
#runs .warn { color: var(--warn); font-size: 12px; }
.ctl { display: flex; flex-direction: column; gap: 9px; padding: 2px 4px; }
.ctl label, .ctl .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink-2); }
.ctl .row > span:first-child, .ctl label > span:first-child { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 3px; overflow: hidden; }
.seg button { border-radius: 0; padding: 2px 8px; color: var(--ink-2); border: 0; }
.seg button + button { border-left: 1px solid var(--border-2); }
.seg button[aria-pressed="true"] { background: var(--sel-2); color: var(--ink); }
input[type=range] { width: 120px; accent-color: var(--ink-2); }
input[type=checkbox] { accent-color: var(--ink-2); width: 14px; height: 14px; margin: 0; }
.ctl .val { min-width: 34px; text-align: right; color: var(--ink); }

/* main */
main { overflow-y: auto; padding: 12px 16px 60px; scrollbar-gutter: stable; }
.filterrow { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.filterrow input { max-width: 420px; }
.filterrow .hint { color: var(--ink-3); white-space: nowrap; }
.filterrow .grouptools { margin-left: auto; display: flex; gap: 2px; color: var(--ink-2); white-space: nowrap; }
section.group { margin-bottom: 18px; }
section.group > h3 {
  font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
}
section.group > h3 .count { color: var(--ink-3); font-weight: 400; }
section.group > h3 .chev { display: inline-block; width: 0; height: 0; border: 5px solid transparent; border-left: 6px solid var(--ink-3); border-right: 0; transform: rotate(90deg); transition: transform .12s; }
section.group.closed > h3 .chev { transform: none; }
section.group.closed > .grid { display: none; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
main[data-cols="1"] .grid { grid-template-columns: 1fr; }
main[data-cols="2"] .grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
main[data-cols="3"] .grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
main[data-cols="4"] .grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 4px; height: 240px;
  display: flex; flex-direction: column; min-width: 0; position: relative;
}
.card.big { grid-column: 1 / -1; height: 480px; }
.card:focus-within, .card:hover { border-color: var(--border-2); }
.card .head { display: flex; align-items: center; height: 28px; padding: 0 4px 0 10px; gap: 4px; flex: none; }
.card .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.card .title .pre { color: var(--ink-3); }
.card .title .run { color: var(--ink-2); }
.card .acts { display: flex; gap: 0; opacity: 0; transition: opacity .1s; }
.card:hover .acts, .card:focus-within .acts, .card.zoomed .acts, .card .acts:has([aria-pressed="true"]) { opacity: 1; }
.card .acts button[hidden] { display: none; }
.card .acts .zoomb { color: var(--ink); border: 1px solid var(--border-2); margin-right: 4px; }
.card .acts button { padding: 2px 5px; color: var(--ink-3); display: inline-flex; align-items: center; line-height: 1; }
.card .acts button:hover { color: var(--ink); }
.card .acts button[aria-pressed="true"] { color: var(--ink); }
.card .acts button.pin[aria-pressed="true"] { opacity: 1; }
.card .acts svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.card .acts .txt { font-size: 11px; font-weight: 600; }
.plot { flex: 1; min-height: 0; position: relative; cursor: crosshair; }
.plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.plot .note { position: absolute; left: 10px; top: 6px; color: var(--ink-3); font-size: 11px; pointer-events: none; }
.tip {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  background: var(--card-2); border: 1px solid var(--border-2); border-radius: 4px; padding: 6px 8px;
  font-size: 12px; min-width: 140px; max-width: 320px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
.tip.on { display: block; }
.tip .th { color: var(--ink-2); margin-bottom: 4px; white-space: nowrap; }
.tip table { border-collapse: collapse; }
.tip td { padding: 1px 4px 1px 0; white-space: nowrap; vertical-align: baseline; }
.tip td.k { width: 14px; padding-right: 6px; }
.tip td.k i { display: block; width: 14px; height: 2px; background: var(--c); border-radius: 1px; }
.tip td.v { font-weight: 600; text-align: right; }
.tip td.r { color: var(--ink-3); text-align: right; }
.tip td.n { color: var(--ink-2); max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.tip tr.hl td.n { color: var(--ink); }
.tip tr.dim { opacity: .5; }
/* text cards */
.textbody { flex: 1; min-height: 0; overflow: auto; padding: 4px 10px 8px; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--ink-2); }
.textnav { display: flex; align-items: center; gap: 8px; padding: 0 10px 6px; color: var(--ink-3); font-size: 11px; }
.textnav input[type=range] { flex: 1; width: auto; }
/* states */
.state { max-width: 640px; margin: 40px auto; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 20px 24px; color: var(--ink-2); }
.state h2 { margin: 0 0 8px; color: var(--ink); font-size: 15px; }
.state pre { background: var(--page); border: 1px solid var(--border); padding: 8px 10px; border-radius: 3px; overflow-x: auto; color: var(--ink); }
.state p { margin: 8px 0; }
.empty { color: var(--ink-3); padding: 20px 4px; }
.empty button { border-color: var(--border-2); margin-left: 8px; }
@media (max-width: 860px) {
  body { grid-template-columns: 1fr !important; grid-template-rows: 44px auto minmax(0,1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 45vh; }
  aside .resize { display: none; }
  header .root { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  <span class="root" id="rootLabel" title=""></span>
  <span class="errs" id="errs" title=""></span>
  <span class="fresh"><span class="dot busy" id="dot"></span><span id="freshText">starting</span></span>
  <select id="refreshSel" title="Refresh interval" aria-label="Refresh interval">

  <button id="refreshBtn" title="Refresh now" aria-label="Refresh now">refresh</button>
  <button id="themeBtn" title="Switch theme" aria-label="Switch theme">light</button>
</header>
<aside>
  <h2>Runs <span class="count" id="runCount"></span></h2>
  <input type="text" id="runFilter" placeholder="filter runs (regex)" aria-label="Filter runs" spellcheck="false">
  <div class="runtools">
    <span class="master" id="master" role="checkbox" tabindex="0" aria-checked="false" title="Toggle every listed run"><span class="sw"></span><span class="mlabel">all runs</span></span>
    <button data-act="invert" title="Invert the selection of the listed runs">invert</button>
  </div>
  <ul id="runs"></ul>
  <div class="disp">
  <h2>Display</h2>
  <div class="ctl">
    <div class="row"><span>smoothing</span><input type="range" id="smooth" min="0" max="0.99" step="0.01" aria-label="Smoothing"><span class="val num" id="smoothVal">0</span></div>
    <div class="row"><span>x axis</span><span class="seg" id="xmode" role="group" aria-label="X axis"><button data-v="step">step</button><button data-v="rel">time</button><button data-v="wall">clock</button></span></div>
    <div class="row"><span>y axis</span><span class="seg" id="ymode" role="group" aria-label="Y axis"><button data-v="lin">linear</button><button data-v="log">log</button></span></div>
    <div class="row"><span>columns</span><span class="seg" id="cols" role="group" aria-label="Columns"><button data-v="0">auto</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button></span></div>
    <label><span>ignore outliers when fitting y</span><input type="checkbox" id="outliers"></label>
    <label><span>sync zoom across charts</span><input type="checkbox" id="sync"></label>
    <label title="After a restart, TensorBoard-style logs contain steps twice. Off drops the older copy; on keeps every point in the order it was written."><span>keep overwritten points</span><input type="checkbox" id="keep"></label>
  </div>
  </div>
  <div class="resize" id="resize" title="Drag to resize"></div>
</aside>
<div class="tip" id="tip" role="status"></div>
<main id="main">
  <div class="filterrow">
    <input type="text" id="tagFilter" placeholder="filter tags (regex)" aria-label="Filter tags" spellcheck="false">
    <span class="hint" id="tagHint"></span>
    <span class="grouptools"><button id="collapseAll" title="Collapse every tag group">collapse all</button><button id="expandAll" title="Expand every tag group">expand all</button></span>
  </div>
  <div id="content"></div>
</main>

'use strict';
/* =====================================================================
   Worker: discovery, fetching, TFRecord + protobuf decoding, series store
   ===================================================================== */
function workerMain() {
  const dec = new TextDecoder('utf-8');
  const post = (m, t) => self.postMessage(m, t || []);

  // ---- CRC-32C (Castagnoli), masked as TensorFlow does -----------------
  const CRC_T = new Int32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 1) ? ((c >>> 1) ^ 0x82F63B78) : (c >>> 1); CRC_T[i] = c; }

  // ---- protobuf wire reader ------------------------------------------------
  class R {
    constructor(u8, dv, pos, end) { this.u8 = u8; this.dv = dv; this.pos = pos; this.end = end; }
    varint() {
      let r = 0, m = 1, b;
      do { if (this.pos >= this.end) throw new Error('truncated varint'); b = this.u8[this.pos++]; r += (b & 0x7f) * m; m *= 128; } while (b & 0x80);
      return r >= 9223372036854775808 ? r - 18446744073709551616 : r;
    }
    skip(wt) {
      if (wt === 0) this.varint(); else if (wt === 1) this.pos += 8; else if (wt === 2) { const n = this.varint(); this.pos += n; } else if (wt === 5) this.pos += 4;
      else throw new Error('bad wire type ' + wt);
      if (this.pos > this.end) throw new Error('truncated field');
    }
    bytes() { const n = this.varint(); const s = this.pos; this.pos += n; if (this.pos > this.end) throw new Error('truncated bytes'); return this.u8.subarray(s, this.pos); }
    str() { return dec.decode(this.bytes()); }
    f64() { const v = this.dv.getFloat64(this.pos, true); this.pos += 8; return v; }
    f32() { const v = this.dv.getFloat32(this.pos, true); this.pos += 4; return v; }
    sub() { const n = this.varint(); const r = new R(this.u8, this.dv, this.pos, this.pos + n); this.pos += n; if (this.pos > this.end) throw new Error('truncated message'); return r; }
    more() { return this.pos < this.end; }
  }
  // repeated numeric field: packed (wt 2) or single
  function repNum(r, wt, out, kind) {
    if (wt === 2) { const s = r.sub(); while (s.more()) out.push(kind === 'f32' ? s.f32() : kind === 'f64' ? s.f64() : s.varint()); }

    const t = { dtype: 0, shape: [], content: null, f32: [], f64: [], i32: [], i64: [], str: [], bool: [], half: [], u32: [], u64: [] };

  <p>BlernsBoard reads runs by listing the directory it is served from, so the page needs to sit inside the log directory, or be pointed at one on the same server with <code>?logdir=path/</code>.</p>
  <p>Simplest setup:</p><pre>cp blernsboard.html /path/to/logs/\ncd /path/to/logs && python3 -m http.server --bind 0.0.0.0 6006\n# then open http://&lt;host&gt;:6006/blernsboard.html</pre>
  <p>Or, without copying: <code>python3 serve.py /path/to/logs</code></p>`;
  d.querySelector('code').textContent = rootUrl; d.querySelector('b').textContent = m.message;
  $('#content').appendChild(d);
}
function showRootEmpty(m) {
  rootProblem = true; setFresh('bad', 'no event files');
  $('#content').innerHTML = '';
  const d = document.createElement('div'); d.className = 'state';
  d.innerHTML = m.looksHtml
    ? `<h2>No event files found</h2><p>The listing at <code></code> contains no directories and no files whose name includes <b>tfevents</b>. Is this the right directory? Runs are found by walking sub-directories up to 10 levels deep.</p>`
    : `<h2>This does not look like a directory listing</h2><p><code></code> returned <b></b> instead of an HTML listing with links. Serve the log directory with a server that lists directories, for example <code>python3 -m http.server</code>, and open this page from inside it.</p>`;
  d.querySelector('code').textContent = rootUrl; const b = d.querySelector('b'); if (!m.looksHtml) b.textContent = m.contentType || 'an unknown content type';
  $('#content').appendChild(d);
}

// ---- boot --------------------------------------------------------------------------------
loadState();
document.documentElement.dataset.theme = state.theme;
$('#themeBtn').textContent = state.theme === 'dark' ? 'light' : 'dark';
$('#rootLabel').textContent = rootLabel(); $('#rootLabel').title = rootUrl;
document.title = 'BlernsBoard · ' + rootLabel().split('/').filter(Boolean).pop();
$('#smooth').value = state.s; $('#smoothVal').textContent = state.s.toFixed(2);
$('#outliers').checked = state.o; $('#sync').checked = state.sync; $('#keep').checked = state.keep;
$('#refreshSel').value = String([5, 15, 30, 60, 0].includes(state.r) ? state.r : 15);
$('#tagFilter').value = state.tags; try { tagRegex = state.tags ? new RegExp(state.tags, 'i') : null; } catch { tagRegex = null; }
$('#main').dataset.cols = state.cols || '';
syncX(); syncY(); syncCols();
$('#content').innerHTML = '<div class="state"><h2>Reading logs</h2><p>Listing <code></code></p></div>'; $('#content code').textContent = rootLabel();
worker.postMessage({ type: 'start', root: rootUrl, intervalMs: state.r * 1000, purge: !state.keep });
document.addEventListener('visibilitychange', () => { if (!document.hidden) worker.postMessage({ type: 'refresh' }); });
// sidebar resize
document.body.style.setProperty('--side', Math.min(600, Math.max(180, state.side || 264)) + 'px');
{
  const grip = $('#resize'); let drag = null;
  grip.addEventListener('pointerdown', e => { drag = { x: e.clientX, w: parseFloat(getComputedStyle(document.body).getPropertyValue('--side')) }; grip.classList.add('on'); grip.setPointerCapture(e.pointerId); });
  grip.addEventListener('pointermove', e => { if (!drag) return; state.side = Math.min(600, Math.max(180, drag.w + e.clientX - drag.x)); document.body.style.setProperty('--side', state.side + 'px'); });
  grip.addEventListener('pointerup', () => { if (!drag) return; drag = null; grip.classList.remove('on'); saveState(); });
}
window.addEventListener('keydown', e => { if (e.key === 'Escape') { for (const c of cards.values()) c.zoom = null; globalZoom = null; allDirty(); } });
})();
</script>
